apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
spec:
  type: LoadBalancer               # AWS will automatically create a public IP / ELB
  selector:
    app: ml-inference             # which pods to forward traffic to
  ports:
    - protocol: TCP
      port: 80                    # the port users hit externally
      targetPort: 8000            # the port inside the pod/container
